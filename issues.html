<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bug Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="issues.css">
</head>
<body>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <h2>Bug Tracker</h2>
    <button class="btn-cancel" style="border-radius: 20px;" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
  </div>

  <div id="message"></div>

  <div class="card-dark">
    <h4>Create New Issue</h4>
    <div class="row g-3">
      <div class="col-md-12">
        <label>Summary *</label>
        <input type="text" id="c-summary" class="form-control" placeholder="Short description of the bug"/>
      </div>
      <div class="col-md-12">
        <label>Detailed Description *</label>
        <textarea id="c-description" class="form-control" rows="3" placeholder="Explain the bug in detail..."></textarea>
      </div>
      <div class="col-md-6">
        <label>Identified By *</label>
        <select id="c-identified-by" class="form-select">
          <option value="">-- Select person --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Date Identified *</label>
        <input type="date" id="c-date" class="form-control"/>
      </div>
      <div class="col-md-6">
        <label>Project *</label>
        <select id="c-project" class="form-select">
          <option value="">-- Select project --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Assign To</label>
        <select id="c-assigned" class="form-select">
          <option value="">-- Unassigned --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Status *</label>
        <select id="c-status" class="form-select">
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Priority *</label>
        <select id="c-priority" class="form-select">
          <option value="">-- Select priority --</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Target Resolution Date</label>
        <input type="date" id="c-target" class="form-control"/>
      </div>
      <div class="col-md-6">
        <label>Actual Resolution Date</label>
        <input type="date" id="c-actual" class="form-control"/>
      </div>
      <div class="col-md-12">
        <label>Resolution Summary</label>
        <textarea id="c-resolution" class="form-control" rows="2" placeholder="How was the issue resolved?"></textarea>
      </div>
      <div class="col-md-12">
        <button class="btn-gold" onclick="createIssue()">Create Ticket</button>
        <button class="btn-cancel ms-2" onclick="clearCreateForm()">Clear</button>
      </div>
    </div>
  </div>

  <div class="card-dark">
    <h4>All Issues</h4>
    <p style="color:#8b949e; font-size:13px;">Click <strong style="color:#d4af37">Edit</strong> on any row to update it.</p>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Summary</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="issue-table-body"></tbody>
    </table>
    <p id="no-issues" style="color:#8b949e; font-size:13px; margin-top:16px;">No tickets yet. Create one above.</p>
  </div>

  <div class="card-dark" id="edit-section">
    <h4>Edit Issue — <span id="edit-id-label" style="color:#8b949e; font-size:14px;"></span></h4>
    <div class="row g-3">
      <div class="col-md-12">
        <label>Summary *</label>
        <input type="text" id="e-summary" class="form-control"/>
      </div>
      <div class="col-md-12">
        <label>Detailed Description *</label>
        <textarea id="e-description" class="form-control" rows="3"></textarea>
      </div>
      <div class="col-md-6">
        <label>Identified By *</label>
        <select id="e-identified-by" class="form-select">
          <option value="">-- Select person --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Date Identified *</label>
        <input type="date" id="e-date" class="form-control"/>
      </div>
      <div class="col-md-6">
        <label>Project *</label>
        <select id="e-project" class="form-select">
          <option value="">-- Select project --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Assign To</label>
        <select id="e-assigned" class="form-select">
          <option value="">-- Unassigned --</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Status *</label>
        <select id="e-status" class="form-select">
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
          <option value="overdue">Overdue</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Priority *</label>
        <select id="e-priority" class="form-select">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="col-md-6">
        <label>Target Resolution Date</label>
        <input type="date" id="e-target" class="form-control"/>
      </div>
      <div class="col-md-6">
        <label>Actual Resolution Date</label>
        <input type="date" id="e-actual" class="form-control"/>
      </div>
      <div class="col-md-12">
        <label>Resolution Summary</label>
        <textarea id="e-resolution" class="form-control" rows="2"></textarea>
      </div>
      <div class="col-md-12">
        <button class="btn-gold" onclick="saveEdit()">Save Changes</button>
        <button class="btn-cancel ms-2" onclick="closeEdit()">Cancel</button>
        <button class="btn-delete ms-2" onclick="deleteIssue()">Delete</button>
      </div>
    </div>
  </div>

  <script src="issues.js"></script>
</body>
</html>
