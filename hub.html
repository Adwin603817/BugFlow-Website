<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Hub | BugFlow</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dark-mode d-flex align-items-center justify-content-center" style="min-height: 100vh;">
  
  <div class="container text-center">
    <h1 class="fw-bold logo-style mb-3">🐛 BugFlow System</h1>
    <p class="text-muted mb-5">Select a workspace module to continue</p>

    <div class="row g-4 justify-content-center" style="max-width: 900px; margin: 0 auto;">
      
      <div class="col-md-4">
        <div class="card task-card border-0 h-100 p-4 shadow-sm" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'" onclick="window.location.href='dashboard.html'">
          <h1 class="mb-3">📊</h1>
          <h5 class="fw-bold text-gold">Bug Dashboard</h5>
          <p class="text-muted small mb-0">View, filter, and resolve active system tickets.</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card task-card border-0 h-100 p-4 shadow-sm" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'" onclick="window.location.href='projects.html'">
          <h1 class="mb-3">📁</h1>
          <h5 class="fw-bold text-gold">Projects</h5>
          <p class="text-muted small mb-0">Manage project scopes, timelines, and domains.</p>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card task-card border-0 h-100 p-4 shadow-sm" style="cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-5px)'" onmouseout="this.style.transform='translateY(0)'" onclick="window.location.href='people.html'">
          <h1 class="mb-3">👥</h1>
          <h5 class="fw-bold text-gold">Team Roster</h5>
          <p class="text-muted small mb-0">Add users, manage profiles, and assign roles.</p>
        </div>
      </div>

    </div>

    <div class="mt-5 pt-4">
      <button class="btn btn-outline-secondary rounded-pill px-5 fw-medium" onclick="window.location.href='welcome.html'">🚪 Log Out of System</button>
    </div>
  </div>

</body>
</html>
