<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugFlow Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dark-mode">
  
  <nav class="navbar navbar-expand-lg sticky-top my-nav mb-4 mt-2 mx-3 rounded-4">
    <div class="container-fluid px-3">
      <span class="navbar-brand mb-0 h4 fw-bold logo-style"> 🐛 BugFlow</span>
      <div class="d-flex align-items-center">
        <div class="input-group input-group-sm me-3" style="width: 220px;">
          <span class="input-group-text bg-transparent border-end-0 text-muted rounded-start-pill ps-3"> 🔍 </span>
          <input type="search" id="searchBox" class="form-control border-start-0 bg-transparent shadow-none rounded-end-pill custom-search" placeholder="Search bugs...">
        </div>
        <button id="darkBtn" class="btn btn-sm btn-outline-secondary rounded-pill me-2"> 🌙 Dark Mode</button>
        <button class="btn btn-sm gold-btn rounded-pill px-3 shadow-sm" onclick="window.location.href='issues.html'">+ New Issue</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 mb-4 mt-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 p-3 rounded-4 shadow-sm filter-bar border">
      <div class="d-flex align-items-center gap-2">
        <span class="text-muted small fw-bold me-2 text-uppercase">Filter:</span>
        <button class="btn btn-sm filter-pill active">All</button>
        <button class="btn btn-sm filter-pill">High</button>
        <button class="btn btn-sm filter-pill">Medium</button>
        <button class="btn btn-sm filter-pill">Low</button>
      </div>
      <div class="d-flex align-items-center gap-4">
        <div class="small text-muted fw-bold d-none d-md-block">
          Total Issues: <span id="stat-total" class="text-gold fs-6">0</span>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted small fw-bold text-uppercase">Sort:</span>
          <select id="sortSelect" class="form-select form-select-sm shadow-sm rounded-pill custom-select" style="width: 170px;">
            <option value="date">Date (Newest First)</option>
            <option value="priority">Priority (High - Low)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid px-4">
    <div id="noResultsMessage" class="text-center mt-5 d-none">
      <h4 class="text-muted fw-bold"> 🔍 No matching issues found</h4>
    </div>

    <div class="row gx-4 mt-2">
      <div class="col-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <h5 class="fw-semibold mb-0">Open</h5>
          <span id="count-open" class="badge rounded-pill bg-white text-dark shadow-sm border column-counter">0</span>
        </div>
        <div id="column-open" class="col-container bg-open d-flex flex-column"></div>
      </div>

      <div class="col-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <h5 class="fw-semibold mb-0">Resolved</h5>
          <span id="count-resolved" class="badge rounded-pill bg-white text-dark shadow-sm border column-counter">0</span>
        </div>
        <div id="column-resolved" class="col-container bg-resolved d-flex flex-column"></div>
      </div>

      <div class="col-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3 px-2">
          <h5 class="fw-semibold mb-0">Overdue</h5>
          <span id="count-overdue" class="badge rounded-pill bg-white text-dark shadow-sm border column-counter">0</span>
        </div>
        <div id="column-overdue" class="col-container bg-overdue d-flex flex-column"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="viewIssueModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content task-card border-0">
        
        <div class="modal-header border-bottom-0 pb-0 mt-2 px-4">
          <h4 class="modal-title fw-bold">Edit Issue — <span id="edit-id-label" class="text-gold"></span></h4>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        
        <div class="modal-body px-4 pt-4 pb-4 text-start">
          <div class="row g-3">
            <div class="col-md-12">
              <label class="small fw-bold text-gold text-uppercase mb-1">Summary *</label>
              <input type="text" id="e-summary" class="form-control custom-input" />
            </div>
            
            <div class="col-md-12">
              <label class="small fw-bold text-gold text-uppercase mb-1">Detailed Description *</label>
              <textarea id="e-description" class="form-control custom-input" rows="3"></textarea>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Identified By *</label>
              <select id="e-identified-by" class="form-select custom-select"></select>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Date Identified *</label>
              <input type="date" id="e-date" class="form-control custom-input"/>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Project *</label>
              <select id="e-project" class="form-select custom-select"></select>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Assign To</label>
              <select id="e-assigned" class="form-select custom-select"></select>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Status *</label>
              <select id="e-status" class="form-select custom-select">
                <option value="open">Open</option>
                <option value="resolved">Resolved</option>
                <option value="overdue">Overdue</option>
              </select>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Priority *</label>
              <select id="e-priority" class="form-select custom-select">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Target Resolution Date</label>
              <input type="date" id="e-target" class="form-control custom-input"/>
            </div>
            
            <div class="col-md-6">
              <label class="small fw-bold text-gold text-uppercase mb-1">Actual Resolution Date</label>
              <input type="date" id="e-actual" class="form-control custom-input"/>
            </div>
            
            <div class="col-md-12">
              <label class="small fw-bold text-gold text-uppercase mb-1">Resolution Summary</label>
              <textarea id="e-resolution" class="form-control custom-input" rows="2"></textarea>
            </div>
          </div>
        </div>
        
        <div class="modal-footer border-top-0 px-4 pb-4 pt-2 d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-medium shadow-sm" onclick="deleteIssue()">Delete</button>
          <div>
            <button type="button" class="btn btn-light rounded-pill px-4 fw-medium me-2" onclick="closeEdit()">Cancel</button>
            <button type="button" class="btn gold-btn rounded-pill px-4 shadow-sm" onclick="saveEdit()">Save Changes</button>
          </div>
        </div>
        
      </div>
    </div>
  </div>


  <div class="dashboard-exit-container">
    <button id="dashboardExitBtn" class="exit-btn" type="button">🚪 Exit Workspace</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
